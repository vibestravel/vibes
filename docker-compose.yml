# Production stack: app + PostgreSQL (with pgvector for Phase 2) + nightly backups.
# Usage: cp .env.example .env  → fill it → docker compose up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vibes_ai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibes}"], interval: 10s, retries: 5 }

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vibes}:${POSTGRES_PASSWORD}@db:5432/vibes_ai
      STORAGE_DIR: /data/storage
    volumes: [storage:/data/storage]
    ports: ["127.0.0.1:3000:3000"] # put Nginx/Caddy with HTTPS in front
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s }

volumes:
  pgdata:
  storage:
